services:
  game:
    image: ${CHANGLU_IMAGE:?Run ./start.sh first, or set CHANGLU_IMAGE to the loaded architecture-specific tag}
    pull_policy: never
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "/game-server", "-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
